# The part CPU cannot reach: the rasteriser itself.
#
# Runs on a self-hosted runner on the workstation. This workflow is the project's
# feedback loop -- it is how a change gets validated against real CUDA without
# anyone watching a terminal, and how the results come back through the GitHub
# API rather than over a shell.
#
# See docs/runner-setup.md to register the runner.
name: gpu

on:
  push:
    # Documentation commits should not occupy the GPU.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/cpu.yml"
  workflow_dispatch:

# Deliberately not `pull_request`: a self-hosted runner executes the code in the
# branch it checks out, so running it on pull requests from outside would hand
# the workstation to whoever opened one.

concurrency:
  # One GPU. Queue rather than fight over it, and do not cancel a run mid-way --
  # a half-finished CUDA job can leave memory held.
  group: gpu
  cancel-in-progress: false

jobs:
  gpu:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Report the hardware
        # The first thing to read when something fails, and on the very first
        # run it is the whole point: it proves the loop is closed.
        run: |
          nvidia-smi
          python3 --version

      - name: Environment
        # A venv inside the workspace, never the system interpreter: a CI job
        # must not be able to modify the workstation's own environment.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,capture]"

      - name: Report the stack
        run: |
          .venv/bin/python - <<'PY'
          import torch
          print("torch      ", torch.__version__)
          print("cuda avail ", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("device     ", torch.cuda.get_device_name(0))
              print("capability ", torch.cuda.get_device_capability(0))
          try:
              import gsplat
              print("gsplat     ", gsplat.__version__)
          except Exception as exc:
              print("gsplat      NOT AVAILABLE:", exc)
          PY

      - name: CUDA is actually present
        # Without this the GPU tests would skip and the job would pass green
        # while proving nothing, which is worse than failing.
        run: .venv/bin/python -c "import torch, sys; sys.exit(0 if torch.cuda.is_available() else 1)"

      - name: GPU tests
        run: .venv/bin/python -m pytest tests/gpu -q

      - name: The device layer must see the GPU
        # The whole point of the runner. If select_device() does not return
        # CUDA here, nothing below this line means anything.
        run: |
          .venv/bin/python - <<'PY'
          from atlas.device import select_device, plan_memory, configure_precision
          report = select_device("cuda")
          print(report)
          assert report.is_cuda and report.free_bytes > 0
          print(plan_memory(600_000, 128, available_bytes=report.free_bytes))
          print("precision:", configure_precision())
          PY

      - name: Smoke train on the GPU
        # The whole pipeline through the CUDA rasteriser: capture, model,
        # contraction, rasterisation, evaluation, gate, ledger. `make smoke-cpu`
        # covers the same seams through the reference renderer; this is the
        # first time any of it touches a GPU.
        run: |
          mkdir -p runs
          .venv/bin/python -m atlas.tools.smoke_cpu --steps 24 --keep runs/smoke-gpu

      - name: The gate, both directions
        run: .venv/bin/python -m pytest tests/test_gate.py -q

      - name: Contraction throughput and memory
        # The number that decides whether the design's "train over-complete at
        # 128 atoms, then compress" is affordable, or whether B has to be
        # chosen before training rather than after. It lands in the ledger with
        # the commit attached, so the next run is comparable with this one, and
        # in the artifact so it can be read without the workstation.
        run: |
          mkdir -p runs
          .venv/bin/python -m atlas.bench \
            --device cuda \
            --primitives 600000 \
            --atoms 32 64 128 \
            --resolution 1080 1920 \
            --report runs/bench-ledger.jsonl \
            --json runs/bench-$GITHUB_SHA.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-artifacts
          path: |
            runs/
            *.json
          if-no-files-found: ignore
          retention-days: 14
