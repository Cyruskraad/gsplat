# Everything that does not need a GPU, on every push.
#
# This is the gap the gsplat fork has: Actions is disabled there at the repo
# level, which is why its handoff docs say "validate by hand". Here the bar is
# enforced instead of remembered.
name: cpu

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install CPU torch
        # The default PyPI torch wheel carries the CUDA runtime -- about 2.5 GB
        # that a CPU runner will never execute. The cpu index is the same torch
        # without it, and it is the difference between a two-minute job and a
        # ten-minute one.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the project
        # torch is already satisfied above, so this resolves the rest only.
        run: pip install -e ".[dev,capture]"

      - name: Lint
        run: python -m black --check --required-version 22.3.0 atlas/ tests/

      - name: Imports
        # py_compile does not evaluate a dataclass's annotations, so a missing
        # import there compiles cleanly and breaks on first run. This catches it.
        run: make imports

      - name: Tests
        run: python -m pytest tests/ -q --ignore=tests/gpu

      - name: The whole pipeline, end to end
        # Generates a capture, trains through the reference renderer, evaluates
        # both held-out sets, runs the gate and writes a run directory. Unit
        # tests cover the pieces; this covers the seams between them.
        run: make smoke-cpu

      - name: The comparison sheet must render with nothing optional installed
        # atlas.eval writes its own PNGs rather than depending on an image
        # library, so that the one artifact a person looks at when a number
        # moves is available on a machine where nothing optional was installed.
        # If that ever stops being true, this step is where it shows up.
        run: |
          python - <<'PY'
          import sys, torch
          from atlas.eval import SheetEntry, comparison_sheet
          reference = torch.rand(16, 16, 3)
          comparison_sheet(
              "/tmp/ci-sheet.png",
              [SheetEntry("CI", reference, reference * 0.9)],
          )
          for forbidden in ("PIL", "imageio", "matplotlib", "lpips"):
              assert forbidden not in sys.modules, forbidden
          PY

      - name: The functional layer must import without gsplat
        # Belt and braces: the boundary is also a test, but a CI step that fails
        # loudly is what stops someone "fixing" the test instead of the import.
        run: |
          python - <<'PY'
          import subprocess, sys
          code = "import sys, atlas.functional; sys.exit(1 if 'gsplat' in sys.modules else 0)"
          sys.exit(subprocess.run([sys.executable, "-c", code]).returncode)
          PY
